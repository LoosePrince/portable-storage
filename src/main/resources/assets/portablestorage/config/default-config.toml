[client]
# 是否偏移背包界面 (true: 上移并显示仓库, false: 保持原样)
offsetInventory = true

# 是否隐藏配方书按钮 (如果 offsetInventory 为 true，此项将被强制视为 true)
hideRecipeBook = true

# 是否显示仓库侧边栏快捷设置按钮
showSmallIcons = true

# 仓库显示位置 (TOP, BOTTOM, LEFT, RIGHT)
storagePosition = "BOTTOM"

[server]
# 是否启用 3x3 背包合成功能
enable3x3Crafting = true

# 是否允许在游戏中热修改服务端配置 (启用后可在设置界面修改服务端项，可能造成非预期情况)
allowHotReload = false

# 是否在玩家死亡时禁用仓库 (true: 禁用, false: 保留)
dropStorageOnDeath = true

# 无条件启用仓库 (NONE: 需要激活, BASE: 自动激活基础版, FULL: 自动激活完整版)
unconditionalWarehouse = "NONE"

# 基础仓库激活道具的物品 ID（持有时使用可激活基础版仓库，默认海洋之心）
baseWarehouseActivationItem = "minecraft:heart_of_the_sea"

# 完整仓库激活道具的物品 ID（持有时使用可激活完整版仓库，默认下界之星）
fullWarehouseActivationItem = "minecraft:nether_star"

# 仓库储存最大种类数 (-1: 不限制)
maxStorageTypes = -1

# 仓库储存物品最大堆叠数 (-1: 不限制)
maxItemStackSize = -1

# 基础仓库储存最大种类数
baseMaxStorageTypes = 54

# 基础仓库储存物品最大堆叠数 (-1: 不限制)
baseMaxItemStackSize = -1

# 物品NBT数据最大大小（字节，-1: 不限制，默认10KB）
maxItemNbtSize = 10240

# 是否启用潮涌核心升级（禁用时该升级槽位不显示且效果无效）
enableConduitUpgrade = true

# 裂隙升级物品 ID
riftUpgradeItem = "minecraft:dragon_egg"

# 裂隙空间大小（区块边长）
riftChunkSize = 1

# 裂隙地块间距（区块）
riftPlotSpacingChunks = 64

# 裂隙默认地板高度
riftFloorY = 64

# 是否启用裂隙区块强加载
enableRiftForcedLoading = true

# 裂隙强加载范围（区块半径，实际不会超过地块半径）
riftForcedLoadingRange = 1

# 是否启用裂隙复制体
enableRiftAvatar = true

# 是否启用裂隙个人边界
enableRiftBorder = true

# 裂隙边界警告距离（方块）
riftBorderWarningBlocks = 0
