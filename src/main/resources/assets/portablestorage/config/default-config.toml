[client]
# 是否偏移背包界面 (true: 上移并显示仓库, false: 保持原样)
offsetInventory = true

# 是否隐藏配方书按钮 (如果 offsetInventory 为 true，此项将被强制视为 true)
hideRecipeBook = true

# 是否显示仓库侧边栏快捷设置按钮
showSmallIcons = true

# 仓库显示位置 (TOP, BOTTOM, LEFT, RIGHT)
storagePosition = "BOTTOM"

[server]
# 是否启用 3x3 背包合成功能
enable3x3Crafting = true

# 是否允许在游戏中热修改服务端配置 (启用后可在设置界面修改服务端项，可能造成非预期情况)
allowHotReload = false

# 是否在玩家死亡时禁用仓库 (true: 禁用, false: 保留)
dropStorageOnDeath = true

# 无条件启用仓库 (NONE: 需要激活, BASE: 自动激活基础版, FULL: 自动激活完整版)
unconditionalWarehouse = "NONE"

# 仓库储存最大种类数 (-1: 不限制)
maxStorageTypes = -1

# 仓库储存物品最大堆叠数 (-1: 不限制)
maxItemStackSize = -1

# 基础仓库储存最大种类数
baseMaxStorageTypes = 54

# 基础仓库储存物品最大堆叠数 (-1: 不限制)
baseMaxItemStackSize = -1

# 物品NBT数据最大大小（字节，-1: 不限制，默认10KB）
maxItemNbtSize = 10240
