# 自动构建项目并在每次 push 或 PR 时运行测试，防止坏提交。
# 如果版本号有更新，则自动创建 release。

name: build
on:
  push:
    branches:
      - 1.20.1
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      changelog: ${{ steps.check_version.outputs.changelog }}
      force_publish: ${{ steps.check_version.outputs.force_publish }}
      minecraft_version: ${{ steps.check_version.outputs.minecraft_version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: check version changes
        id: check_version
        run: |
          CURRENT_VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep "minecraft_version=" gradle.properties | cut -d'=' -f2)
          echo "Current version: $CURRENT_VERSION"
          echo "Minecraft version: $MINECRAFT_VERSION"
          echo "minecraft_version=$MINECRAFT_VERSION" >> $GITHUB_OUTPUT

          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%B")
          echo "Commit message: $COMMIT_MESSAGE"

          if echo "$COMMIT_MESSAGE" | grep -q "\[RELEASE\]"; then
            echo "force_publish=true" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "force_publish=false" >> $GITHUB_OUTPUT

            if git diff HEAD~1 HEAD --name-only | grep -q "gradle.properties"; then
              PREVIOUS_VERSION=$(git show HEAD~1:gradle.properties | grep "mod_version=" | cut -d'=' -f2)
              echo "Previous version: $PREVIOUS_VERSION"

              if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                echo "changed=true" >> $GITHUB_OUTPUT
                echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                echo "changelog<<EOF" >> $GITHUB_OUTPUT
                echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
                echo "" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              else
                echo "changed=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: (needs.build.outputs.version_changed == 'true' || needs.build.outputs.force_publish == 'true') && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: publish to platforms
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: build/libs/portablestorage-${{ needs.build.outputs.new_version }}.jar
          name: Portable Storage ${{ needs.build.outputs.new_version }} [Fabric ${{ needs.build.outputs.minecraft_version }}]
          version: ${{ needs.build.outputs.new_version }}
          version-type: release
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: fabric
          environment: 'client | server'
          curseforge-environment: 'client | server'
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          java: 21
          dependencies: |
            dev.isxander.yacl3(optional){modrinth:yacl}{curseforge:yacl}
          curseforge-id: 1365553
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          modrinth-id: fgNKEUno
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
          github-tag: v${{ needs.build.outputs.new_version }}+${{ needs.build.outputs.minecraft_version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-changelog: |
            ## Portable Storage ${{ needs.build.outputs.new_version }}

            ### 更新内容
            ${{ needs.build.outputs.changelog }}
